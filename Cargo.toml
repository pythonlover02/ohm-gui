[package]
name = "ohm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"

[lib]
name = "ohm"
path = "src/ohm/lib.rs"

[[bin]]
name = "ohm"
path = "src/ohm/ohm.rs"

[[bin]]
name = "ohm-probe"
path = "src/ohm-probe/ohm-probe.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
