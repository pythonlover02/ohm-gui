name: Test Builds on Linux

on: [push, pull_request, workflow_dispatch]

jobs:
  build-set-linux:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        rust: ['1.85.1', 'stable']

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v4

    - name: Setup problem matcher
      uses: r7kamura/rust-problem-matchers@v1

    - name: Setup Rust
      id: setup-rust
      shell: bash
      run: rustup toolchain install ${{ matrix.rust }} --profile minimal

    - name: Build ohm
      id: build-ohm
      run: make ohm CARGO="cargo +${{ matrix.rust }}"

    - name: Run checks
      id: run-checks
      run: cargo +${{ matrix.rust }} test

  check-gui:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v4

    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Compile sources
      id: compile-sources
      run: python -m compileall -q src/ohm-gui

    - name: Import pure modules
      id: import-modules
      run: cd src/ohm-gui && python -c "import probe, profiles, presets, database"

    - name: Check version sync
      id: check-version
      shell: bash
      run: |
        crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
        gui=$(cd src/ohm-gui && python -c "import database; print(database.APP_VERSION)")
        echo "crate=${crate} gui=${gui}"
        test "${crate}" = "${gui}"
