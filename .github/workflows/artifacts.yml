name: Artifacts (Package)

on: [push, pull_request, workflow_dispatch]

jobs:
  artifacts-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup problem matcher
      uses: r7kamura/rust-problem-matchers@v1

    - name: Install dependencies
      id: install-dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends python3-venv python3-dev

    - name: Get version
      id: get-version
      shell: bash
      run: |
        echo "VERSION_NAME=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}" >> $GITHUB_ENV
        echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> $GITHUB_ENV

    - name: Build ohm and gui
      id: build-all
      run: make

    - name: Build dist tree
      id: build-dist
      run: make dist

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ohm-gui-${{ env.VERSION_NAME }}
        path: build/dist/ohm-gui-${{ env.VERSION }}
        if-no-files-found: error
